name: "Hive Integration Test CI/CD"

on:
  push:
    branches: [ taiko ]
    paths-ignore:
      - "taiko/taiko-mono/**"
    paths:
      - "taiko/**"

jobs:
  integration_tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21
          cache: true

      - name: Test
        working-directory: ./
        run: go test -test.run TestTaikoSimulator
